[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autofx-studio"
version = "0.2.1"
description = "Terminal-first automatic short-form editing, procedural SFX, LUTs and NLE handoff"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24,<3", "opencv-python-headless>=4.8,<6", "imageio-ffmpeg==0.6.0"]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]

[project.scripts]
autofx = "autofx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
